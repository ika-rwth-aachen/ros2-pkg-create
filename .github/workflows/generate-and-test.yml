name: Generate and test packages

# avoiding duplicate jobs on push with open pull_request: https://github.com/orgs/community/discussions/26940#discussioncomment-6656489
on: [push, pull_request]

jobs:

  generate:
    if: (github.event_name != 'pull_request' && ! github.event.pull_request.head.repo.fork) || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork)
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - package_name: default_cpp_pkg
            template: ros2_cpp_pkg
            auto_shutdown: true
          - package_name: component_cpp_pkg
            template: ros2_cpp_pkg
            is_component: true
            auto_shutdown: true
          - package_name: lifecycle_cpp_pkg
            template: ros2_cpp_pkg
            is_lifecycle: true
            auto_shutdown: true
          - package_name: multi_threaded_cpp_pkg
            template: ros2_cpp_pkg
            executor_type: MultiThreadedExecutor
            auto_shutdown: true
          - package_name: service_cpp_pkg
            template: ros2_cpp_pkg
            has_service_server: true
            auto_shutdown: true
          - package_name: action_cpp_pkg
            template: ros2_cpp_pkg
            has_action_server: true
            auto_shutdown: true
          - package_name: timer_cpp_pkg
            template: ros2_cpp_pkg
            has_timer: true
            auto_shutdown: true
          - package_name: diagnostics_cpp_pkg
            template: ros2_cpp_pkg
            has_timer: true
            has_diagnostics: true
            auto_shutdown: true
          - package_name: no_params_cpp_pkg
            template: ros2_cpp_pkg
            has_params: false
            auto_shutdown: true
          - package_name: no_launch_file_cpp_pkg
            template: ros2_cpp_pkg
            has_launch_file: false
            auto_shutdown: true
          - package_name: all_cpp_pkg
            template: ros2_cpp_pkg
            is_component: true
            is_lifecycle: true
            has_service_server: true
            has_action_server: true
            has_timer: true
            has_diagnostics: true
            auto_shutdown: true
          - package_name: default_python_pkg
            template: ros2_python_pkg
            auto_shutdown: true
          - package_name: service_python_pkg
            template: ros2_python_pkg
            has_service_server: true
            auto_shutdown: true
          - package_name: action_python_pkg
            template: ros2_python_pkg
            has_action_server: true
            auto_shutdown: true
          - package_name: timer_python_pkg
            template: ros2_python_pkg
            has_timer: true
            auto_shutdown: true
          - package_name: diagnostics_python_pkg
            template: ros2_python_pkg
            has_diagnostics: true
            auto_shutdown: true
          - package_name: no_params_python_pkg
            template: ros2_python_pkg
            has_params: false
            auto_shutdown: true
          - package_name: no_launch_file_python_pkg
            template: ros2_python_pkg
            has_launch_file: false
            auto_shutdown: true
          - package_name: all_python_pkg
            template: ros2_python_pkg
            is_lifecycle: true
            has_service_server: true
            has_action_server: true
            has_timer: true
            has_diagnostics: true
            auto_shutdown: true
          - package_name: runtime_cpp_pkg
            template: ros2_cpp_pkg
            executor_type: MultiThreadedExecutor
            has_diagnostics: true
            auto_shutdown: false
          - package_name: runtime_python_pkg
            template: ros2_python_pkg
            has_diagnostics: true
            auto_shutdown: false
          - package_name: runtime_lifecycle_pkg
            template: ros2_cpp_pkg
            is_lifecycle: true
            is_component: true
            has_params: false
            has_timer: true
            has_diagnostics: true
            auto_shutdown: false
          - package_name: runtime_no_params_python_pkg
            template: ros2_python_pkg
            has_params: false
            has_diagnostics: true
            auto_shutdown: false
          - package_name: runtime_subscriber_python_pkg
            template: ros2_python_pkg
            has_params: false
            has_publisher: false
            has_diagnostics: true
            auto_shutdown: false
          - package_name: runtime_publisher_python_pkg
            template: ros2_python_pkg
            has_params: false
            has_subscriber: false
            has_diagnostics: true
            auto_shutdown: false
          - package_name: runtime_empty_python_pkg
            template: ros2_python_pkg
            has_params: false
            has_subscriber: false
            has_publisher: false
            has_diagnostics: true
            auto_shutdown: false
          - package_name: runtime_empty_cpp_pkg
            template: ros2_cpp_pkg
            has_params: false
            has_subscriber: false
            has_publisher: false
            has_diagnostics: true
            auto_shutdown: false
          - package_name: runtime_cpp_xml_pkg
            template: ros2_cpp_pkg
            launch_file_type: xml
            has_diagnostics: true
            auto_shutdown: false
          - package_name: runtime_cpp_yml_pkg
            template: ros2_cpp_pkg
            launch_file_type: yml
            has_diagnostics: true
            auto_shutdown: false
          - package_name: runtime_python_xml_pkg
            template: ros2_python_pkg
            launch_file_type: xml
            has_diagnostics: true
            auto_shutdown: false
          - package_name: runtime_python_yml_pkg
            template: ros2_python_pkg
            launch_file_type: yml
            has_diagnostics: true
            auto_shutdown: false
          - package_name: interfaces_pkg
            template: ros2_interfaces_pkg
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install dependencies
        run: |
          pip install "copier~=9.2.0" "jinja2-strcase~=0.0.2"
      - name: Configure git to run copier
        run: |
          git config --global user.name "dummy"
          git config --global user.email "dummy@dummy.com"
      - name: Generate packages
        run: |
          copier copy --trust --defaults --vcs-ref=HEAD \
            -d template=${{ matrix.template }} \
            -d auto_shutdown=${{ matrix.auto_shutdown }} \
            -d package_name=${{ matrix.package_name }} \
            $( [ "${{ matrix.is_component }}" = "true" ] && echo "-d is_component=true" ) \
            $( [ "${{ matrix.is_lifecycle }}" = "true" ] && echo "-d is_lifecycle=true" ) \
            $( [ -n "${{ matrix.executor_type }}" ] && echo "-d executor_type=${{ matrix.executor_type }}" ) \
            $( [ "${{ matrix.has_service_server }}" = "true" ] && echo "-d has_service_server=true" ) \
            $( [ "${{ matrix.has_action_server }}" = "true" ] && echo "-d has_action_server=true" ) \
            $( [ "${{ matrix.has_timer }}" = "true" ] && echo "-d has_timer=true" ) \
            $( [ "${{ matrix.has_diagnostics }}" = "true" ] && echo "-d has_diagnostics=true" ) \
            $( [ "${{ matrix.has_params }}" = "false" ] && echo "-d has_params=false" ) \
            $( [ "${{ matrix.has_launch_file }}" = "false" ] && echo "-d has_launch_file=false" ) \
            $( [ "${{ matrix.has_subscriber }}" = "false" ] && echo "-d has_subscriber=false" ) \
            $( [ "${{ matrix.has_publisher }}" = "false" ] && echo "-d has_publisher=false" ) \
            $( [ -n "${{ matrix.launch_file_type }}" ] && echo "-d launch_file_type=${{ matrix.launch_file_type }}" ) \
            . packages
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.package_name }}
          path: "packages/${{ matrix.package_name }}*"

  build:
    if: (github.event_name != 'pull_request' && ! github.event.pull_request.head.repo.fork) || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork)
    runs-on: ubuntu-latest
    container:
      image: rwthika/ros2:jazzy
    needs: generate
    strategy:
      matrix:
        include:
          - package: default_cpp_pkg
            command: ros2 launch default_cpp_pkg default_cpp_pkg_launch.py
          - package: component_cpp_pkg
            command: ros2 launch component_cpp_pkg component_cpp_pkg_launch.py
          - package: lifecycle_cpp_pkg
            command: ros2 launch lifecycle_cpp_pkg lifecycle_cpp_pkg_launch.py
          - package: multi_threaded_cpp_pkg
            command: ros2 launch multi_threaded_cpp_pkg multi_threaded_cpp_pkg_launch.py
          - package: service_cpp_pkg
            command: ros2 launch service_cpp_pkg service_cpp_pkg_launch.py
          - package: action_cpp_pkg
            command: ros2 launch action_cpp_pkg action_cpp_pkg_launch.py
          - package: timer_cpp_pkg
            command: ros2 launch timer_cpp_pkg timer_cpp_pkg_launch.py
          - package: diagnostics_cpp_pkg
            command: ros2 launch diagnostics_cpp_pkg diagnostics_cpp_pkg_launch.py
          - package: no_params_cpp_pkg
            command: ros2 launch no_params_cpp_pkg no_params_cpp_pkg_launch.py
          - package: no_launch_file_cpp_pkg
            command: ros2 run no_launch_file_cpp_pkg no_launch_file_cpp_pkg --ros-args -p param:=1.0
          - package: all_cpp_pkg
            command: ros2 launch all_cpp_pkg all_cpp_pkg_launch.py
          - package: default_python_pkg
            command: ros2 launch default_python_pkg default_python_pkg_launch.py
          - package: service_python_pkg
            command: ros2 launch service_python_pkg service_python_pkg_launch.py
          - package: action_python_pkg
            command: ros2 launch action_python_pkg action_python_pkg_launch.py
          - package: timer_python_pkg
            command: ros2 launch timer_python_pkg timer_python_pkg_launch.py
          - package: diagnostics_python_pkg
            command: ros2 launch diagnostics_python_pkg diagnostics_python_pkg_launch.py
          - package: no_params_python_pkg
            command: ros2 launch no_params_python_pkg no_params_python_pkg_launch.py
          - package: no_launch_file_python_pkg
            command: ros2 run no_launch_file_python_pkg no_launch_file_python_pkg --ros-args -p param:=1.0
          - package: all_python_pkg
            command: ros2 launch all_python_pkg all_python_pkg_launch.py
          - package: runtime_cpp_pkg
            command: |
              python3 tests/check_diagnostics.py runtime_cpp_pkg --validate-parameters
              python3 tests/check_diagnostics.py runtime_cpp_pkg --sim-time
              python3 tests/check_diagnostics.py runtime_cpp_pkg --disabled-topics
          - package: runtime_python_pkg
            command: |
              python3 tests/check_diagnostics.py runtime_python_pkg --validate-parameters
              python3 tests/check_diagnostics.py runtime_python_pkg --sim-time
              python3 tests/check_diagnostics.py runtime_python_pkg --disabled-topics
          - package: runtime_lifecycle_pkg
            command: python3 tests/check_diagnostics.py runtime_lifecycle_pkg --lifecycle
          - package: runtime_no_params_python_pkg
            command: python3 tests/check_diagnostics.py runtime_no_params_python_pkg
          - package: runtime_subscriber_python_pkg
            command: python3 tests/check_diagnostics.py runtime_subscriber_python_pkg --no-publisher
          - package: runtime_publisher_python_pkg
            command: python3 tests/check_diagnostics.py runtime_publisher_python_pkg --no-subscriber
          - package: runtime_empty_python_pkg
            command: python3 tests/check_diagnostics.py runtime_empty_python_pkg --no-subscriber --no-publisher --python-checks
          - package: runtime_empty_cpp_pkg
            command: python3 tests/check_diagnostics.py runtime_empty_cpp_pkg --no-subscriber --no-publisher
          - package: runtime_cpp_xml_pkg
            command: python3 tests/check_diagnostics.py runtime_cpp_xml_pkg --launch-file-type xml --namespace ''
          - package: runtime_cpp_yml_pkg
            command: python3 tests/check_diagnostics.py runtime_cpp_yml_pkg --launch-file-type yml
          - package: runtime_python_xml_pkg
            command: python3 tests/check_diagnostics.py runtime_python_xml_pkg --launch-file-type xml --namespace ''
          - package: runtime_python_yml_pkg
            command: python3 tests/check_diagnostics.py runtime_python_yml_pkg --launch-file-type yml
          - package: interfaces_pkg
            command: |
              ros2 interface show interfaces_pkg/msg/Message && \
              ros2 interface show interfaces_pkg/srv/Service && \
              ros2 interface show interfaces_pkg/action/Action
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Download artifacts
        uses: actions/download-artifact@v4
      - name: Install dependencies
        shell: bash
        run: |
          source /opt/ros/$ROS_DISTRO/setup.bash
          apt update && rosdep update
          rosdep install -i --from-paths . -y
      - name: Build
        shell: bash
        run: |
          source /opt/ros/$ROS_DISTRO/setup.bash
          colcon build --packages-up-to ${{ matrix.package }}
      - name: Run
        shell: bash
        env:
          ROS_DOMAIN_ID: "197"
          ROS_AUTOMATIC_DISCOVERY_RANGE: LOCALHOST
        run: |
          source install/setup.bash
          ${{ matrix.command }}
